<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 352" width="900" height="352" role="img" aria-label="How a scan works"><rect width="900" height="352" rx="16" fill="#ffffff" stroke="#e5e7eb"/><text x="24" y="40" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#111827" text-anchor="start">How a scan works</text><text x="24" y="62" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">From a domain name to a report you can act on</text><rect x="24" y="90" width="200" height="165" rx="12" fill="#f9fafb" stroke="#e5e7eb"/><g transform="translate(40 106) scale(1.167)" fill="none" stroke="#111827" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></g><text x="40" y="158" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827" text-anchor="start">1  Discover</text><text x="40" y="180" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">A domain, its subdomains</text><text x="40" y="196" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">and mail servers, or an</text><text x="40" y="212" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">inventory file of sites.</text><path d="M227 165 l12 0 m-5 -5 l5 5 l-5 5" fill="none" stroke="#111827" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="242" y="90" width="200" height="165" rx="12" fill="#f9fafb" stroke="#e5e7eb"/><g transform="translate(258 106) scale(1.167)" fill="none" stroke="#111827" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5L16 9.5"/></g><text x="258" y="158" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827" text-anchor="start">2  Check</text><text x="258" y="180" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">27 automatic checks and</text><text x="258" y="196" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">64 data rules from</text><text x="258" y="212" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">outside; 9 server checks</text><text x="258" y="228" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">run on the server.</text><path d="M445 165 l12 0 m-5 -5 l5 5 l-5 5" fill="none" stroke="#111827" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="460" y="90" width="200" height="165" rx="12" fill="#f9fafb" stroke="#e5e7eb"/><g transform="translate(476 106) scale(1.167)" fill="none" stroke="#111827" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13h6M9 17h6"/></g><text x="476" y="158" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827" text-anchor="start">3  Record evidence</text><text x="476" y="180" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">What was asked, what</text><text x="476" y="196" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">came back, a timestamp</text><text x="476" y="212" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">and a confidence level.</text><path d="M663 165 l12 0 m-5 -5 l5 5 l-5 5" fill="none" stroke="#111827" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="678" y="90" width="200" height="165" rx="12" fill="#f9fafb" stroke="#e5e7eb"/><g transform="translate(694 106) scale(1.167)" fill="none" stroke="#111827" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></g><text x="694" y="158" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827" text-anchor="start">4  Report and track</text><text x="694" y="180" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">HTML, Markdown, CSV and</text><text x="694" y="196" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">JSON reports, a score,</text><text x="694" y="212" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">and what is new or fixed</text><text x="694" y="228" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">since last time.</text><text x="24" y="287" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="start">Every result is one of</text><rect x="24" y="297" width="40" height="20" rx="10" fill="#1a7f37"/><text x="43.8" y="311" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">PASS</text><rect x="71.6" y="297" width="40" height="20" rx="10" fill="#9a6700"/><text x="91.39999999999999" y="311" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">WARN</text><rect x="119.19999999999999" y="297" width="40" height="20" rx="10" fill="#cf222e"/><text x="139.0" y="311" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">FAIL</text><rect x="166.79999999999998" y="297" width="91" height="20" rx="10" fill="#8250df"/><text x="212.2" y="311" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">INCONCLUSIVE</text><rect x="265.6" y="297" width="52" height="20" rx="10" fill="#57606a"/><text x="291.8" y="311" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">MANUAL</text><text x="24" y="337" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">INCONCLUSIVE = not enough evidence to judge. MANUAL = needs a person. Neither is scored.</text></svg>
